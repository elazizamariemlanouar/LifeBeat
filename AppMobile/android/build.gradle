buildscript {
    repositories {
        google()       // Ajoute ceci
        mavenCentral() // Ajoute ceci aussi
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'  // ta version peut être différente
        classpath 'com.google.gms:google-services:4.4.2' // ta dépendance firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
